[package]
name = "vex-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"

[dependencies.vex]
path = ".."

[[bin]]
name = "fuzz_index_reader"
path = "fuzz_targets/fuzz_index_reader.rs"
doc = false

[[bin]]
name = "fuzz_refs_fst"
path = "fuzz_targets/fuzz_refs_fst.rs"
doc = false

[[bin]]
name = "fuzz_symbol_fst"
path = "fuzz_targets/fuzz_symbol_fst.rs"
doc = false

[[bin]]
name = "fuzz_bloom_load"
path = "fuzz_targets/fuzz_bloom_load.rs"
doc = false

[[bin]]
name = "fuzz_pattern_parser"
path = "fuzz_targets/fuzz_pattern_parser.rs"
doc = false

[[bin]]
name = "fuzz_manifest_load"
path = "fuzz_targets/fuzz_manifest_load.rs"
doc = false

# v1.13.0 P2 — marker-cache sidecar parser. New untrusted text
# surface introduced by the SHA-marker fast path.
[[bin]]
name = "fuzz_marker_load"
path = "fuzz_targets/fuzz_marker_load.rs"
doc = false

# v1.13.0 P8 — BM25 tokenizer hot path after the share-owning-String
# refactor. Paranoia layer against unicode edge cases.
[[bin]]
name = "fuzz_tokenize_document"
path = "fuzz_targets/fuzz_tokenize_document.rs"
doc = false

# v1.14.1 B1.1 — HNSW hash-index sidecar parser (`index.hashes`,
# `VEXH` magic). Loaded at every `vex search --semantic` invocation
# by `HnswHandle::open`; must never panic on a malformed sidecar.
[[bin]]
name = "fuzz_hash_index_load"
path = "fuzz_targets/fuzz_hash_index_load.rs"
doc = false

# v1.15.0 B1.2 — incremental HNSW update path. Drives the full
# `build_hnsw_incremental_at(scratch_hnsw, scratch_hash, vectors,
# new_hashes)` against a baked baseline fixture with `new_hashes`
# decoded from the fuzz input. Catches panics in HashSet diff,
# tombstone arithmetic, and usearch's add/remove edge cases on a
# real (small) HNSW.
[[bin]]
name = "fuzz_incremental_hnsw"
path = "fuzz_targets/fuzz_incremental_hnsw.rs"
doc = false

# Phase 14.10 — rename_chains sidecar parser (`index.rename_chains`,
# `VEXR` magic v1). Loaded at every `vex history` chain expansion and
# `vex status`; must never panic on a malformed sidecar.
[[bin]]
name = "fuzz_rename_chains_load"
path = "fuzz_targets/fuzz_rename_chains_load.rs"
doc = false

# v1.18 audit C1 — incremental-state sidecar parser (`index.state`,
# `VEXS` magic v1). Loaded on every `Manifest::load`; carries the
# manifest fields that scale O(cross-file-edges) in bincode form.
# Must never panic — failure falls back to the JSON manifest.
[[bin]]
name = "fuzz_state_load"
path = "fuzz_targets/fuzz_state_load.rs"
doc = false

[[bin]]
name = "fuzz_unresolved_refs"
path = "fuzz_targets/fuzz_unresolved_refs.rs"
doc = false

# v1.23.0 — Kotlin scope binder (`src/parse/scope/kotlin.rs`). Drives the
# full source → tree-sitter parse → symbol extraction → `bind_refs` path on
# arbitrary UTF-8 Kotlin source. Must never panic; Err / empty refs is fine.
[[bin]]
name = "fuzz_kotlin_binder"
path = "fuzz_targets/fuzz_kotlin_binder.rs"
doc = false

# HIERARCHY-EDGES P2 (commits cb0cd71..3e27455) — unresolved_hierarchy
# section reader (`UnresolvedHierarchyReader`, name-keyed FST + postings
# for extends/implements parents outside the corpus). Mirrors
# fuzz_unresolved_refs for the parallel FST-keyed hierarchy section; the
# resolved (FST-free, sorted-array) half is fuzzed in fuzz_index_reader.
[[bin]]
name = "fuzz_unresolved_hierarchy"
path = "fuzz_targets/fuzz_unresolved_hierarchy.rs"
doc = false

[workspace]
members = ["."]
