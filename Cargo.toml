[workspace]
members = [".", "crates/vex-mcp"]

[package]
name = "vex"
version = "1.25.0"
edition = "2021"
description = "Fast hybrid structural + semantic code search (vector + index)"
license = "MIT"
authors = ["Furcas <tenatarika@gmail.com>"]
repository = "https://github.com/tenatarika/vex"
homepage = "https://github.com/tenatarika/vex"
readme = "README.md"
rust-version = "1.88"

[[bin]]
name = "vex"
path = "src/main.rs"

[lib]
name = "vex"
path = "src/lib.rs"

# v1.15.2 CI fix: test binaries with full `debug = 2` info pushed the
# GitHub ubuntu-latest runner past its ~14 GB disk budget during
# `cargo test --workspace` (30+ integration test binaries, each
# statically linked against the full tree-sitter + ONNX dep graph).
# `line-tables-only` keeps file:line in backtraces — the load-bearing
# signal for a test failure — while dropping variable / type / symbol
# debug-info that ballooned each binary 3-5×. Local `cargo test`
# backtraces still resolve to the source line; only LLDB-style
# variable inspection on a test crash is lost (rare; bench profile
# is unaffected).
[profile.test]
debug = "line-tables-only"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Regex for content search
regex = "1.10"
# `vex grep` trigram skip-index parses the pattern's regex AST to extract
# required literals (src/grep/trigram.rs); already in-tree transitively via regex.
regex-syntax = "0.8"

# Tree-sitter core + language grammars
# Versions audited against crates.io latest. See docs/SUPPORTED_LANGUAGES.md.
tree-sitter = "0.26"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-md = "0.5"
tree-sitter-cpp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"

# Embedding generation (bundled ONNX Runtime + tokenizer + model download)
fastembed = "5.13"

# Optional GPU execution providers for embedding (opt-in via gpu-* features).
# Direct dep pinned EXACTLY to fastembed's internal pin so cargo unifies to a
# single ort/onnxruntime build (no second runtime). `optional` + `dep:ort` in
# the gpu-* features means the default CPU build never pulls it. See
# docs/GPU_SUPPORT.md. default-features=false mirrors fastembed's ort pin.
ort = { version = "=2.0.0-rc.12", default-features = false, optional = true }

# HNSW vector index
usearch = "2.25"

# FST for refs lookup (zero-copy, prefix/fuzzy search)
fst = { version = "0.4", features = ["levenshtein"] }

# Memory-mapped IO
memmap2 = "0.9"

# Parallel indexing
rayon = "1.10"

# Filesystem watching
notify = { version = "7.0", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# svn backend parses `svn status/diff --summarize --xml` (src/vcs/svn.rs);
# already in the tree transitively via self_update, so no new compile cost.
quick-xml = "0.37"
bincode = "1.3"
toml = "0.8"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Bloom filter
bloomfilter = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File walking
ignore = "0.4"

# Path globs for per-query --include/--exclude scope filters
globset = "0.4"

# Text diffing for `vex similar --explain` / `vex duplicates --explain`
similar = "2"

# SHA-256 for the MiniLM model integrity check (10.4)
sha2 = "0.10"

# File locking
fs2 = "0.4"

# Shell completions
clap_complete = "4.5"

# Self-update: fetches GitHub releases and replaces the running binary in place.
# `rustls` avoids the openssl C dependency so Windows builds stay
# self-contained. `signatures` enables ed25519 verification via zipsign so a
# compromised release / CDN cannot silently push a malicious binary.
self_update = { version = "0.42", default-features = false, features = [
    "rustls",
    "compression-flate2",
    "archive-tar",
    "signatures",
] }

# Direct dep so the custom self-update apply flow (cli/self_update_flow.rs)
# can verify release signatures itself — self_update's verification is
# private and its all-in-one `update()` extracts only the named binary,
# dropping the DirectML.dll sidecar. Pinned to the exact version
# self_update 0.42 locks so cargo unifies to a single build.
zipsign-api = { version = "=0.1.5", default-features = false, features = [
    "verify-tar",
] }

# Header constants for the self-update asset download (GitHub's API asset
# URL needs `Accept: application/octet-stream`). `self_update::Download`
# takes `reqwest::header::*` types, which are re-exports of this crate —
# depending on `http` directly avoids pulling all of reqwest into our API.
http = "1"

[features]
default = []
# Optional GPU execution providers for semantic embedding. All OFF by default;
# enabled per-target in .github/workflows/release.yml (DirectML on Windows,
# CoreML on macOS) and via `cargo install vex --features gpu-cuda` for NVIDIA.
# NOTE: feature tables can't be cfg(target)-gated and `ort/directml` only builds
# on Windows / `ort/coreml` only on Apple — so these must be applied per-target,
# never put in `default`. See docs/GPU_SUPPORT.md §5.1.
gpu-coreml = ["dep:ort", "ort/coreml"] # macOS — shippable prebuilt
# `ort/directml` is implied by `fastembed/directml` (which also applies the
# required DirectML session tweak); listed explicitly for intent.
gpu-directml = ["dep:ort", "ort/directml", "fastembed/directml"] # Windows — shippable prebuilt
gpu-cuda = ["dep:ort", "ort/cuda"] # NVIDIA — SOURCE BUILD ONLY (host CUDA 12/13 + cuDNN 9)

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.41"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
# Needed by the P2 marker-cache tests to set an explicit mtime on a
# temp file — proves the fast path is taken when mtime + size match.
filetime = "0.2"
# Serializes the env-mutating unit tests (VEX_DEVICE / VEX_EMBEDDER):
# nextest runs in-binary tests on multiple threads, and concurrent
# setenv/getenv is UB (Rust 1.80+ marks set_var unsafe for this reason).
serial_test = "3.2"
# The in-module E2E tests (`#[cfg(test)]` in src/cli/self_update_flow.rs)
# build and sign a synthetic release archive to exercise the
# verify→extract→sidecar-install path without GitHub. `sign-tar` is
# test-only; the shipped binary needs `verify-tar` alone (see
# [dependencies]). tar/flate2 already in the tree via self_update —
# versions track the lockfile.
zipsign-api = { version = "=0.1.5", default-features = false, features = [
    "sign-tar",
] }
tar = "0.4"
flate2 = "1.1"

# Phase 13.2 Inc 7 — first Criterion benchmark in the repo. Establishes a
# latency baseline for the `vex bundle` modes (BFS, indegree scan, symbol
# assembly). Architect-review A10: revisit `pr-impact` rayon-ization if
# the BFS bench measures > 100 ms on the synthetic 50-change fixture.
[[bench]]
name = "bundle"
harness = false

# v1.13.0 — baseline benches for the open Performance items (P1 HNSW
# per-symbol reopen, P2 ONNX SHA on every --semantic, P5 vectors not
# L2-normalized at write time, P7 BTreeMap allocations in FST builders,
# P8 BM25 tokenizer allocations). Run before each P-item lands; diff
# against `benches/results/v1.13-baseline-<sha>.txt`.
[[bench]]
name = "perf_v113"
harness = false

# v1.14.0 — Pass-2 C++ #include-resolution micro-benches. Validates the
# architect's "~2-10s wall on Pass-2 for 50k-symbol corpus" estimate by
# isolating the two hot functions in `store::include_resolver`:
# `build_include_graph` (once per index build) and
# `resolve_via_include_bfs` (once per Unresolved C++ ref).
[[bench]]
name = "perf_v114"
harness = false

# v1.15.0 B1.2 — incremental vs full-rebuild HNSW write path. The
# headline number is the speedup at typical churn rates (1-10%) over
# the v1.14.1 baseline (`build_hnsw_at` full rebuild). The tombstone
# threshold (25%) is also pinned: at the boundary the incremental
# path applies; over it the function returns Ok(false) and the
# orchestrator falls back to a full rebuild — bench compares the bail
# cost to the rebuild cost to verify the threshold isn't too tight.
[[bench]]
name = "perf_b12"
harness = false

# v1.17 Phase 14.10 — `build_rename_chains` micro-bench. Pins the
# chain-builder's absolute cost (LSH build → candidate scan → UF
# merge → sidecar emit) at 1k / 10k / 50k corpus + 0% / 5% / 25%
# rename-pair densities. Backstop for the task's ≤30% re-index
# overhead claim — full-pipeline measurement is sensitive to
# parse/git noise; the function-level bench isolates the chain cost.
[[bench]]
name = "rename_chains"
harness = false

# v1.24+ grep trigram skip-index — headline `vex grep` speedup (skip-active
# vs full-walk on a 500-file corpus) + a false-positive-rate-by-literal-length
# table that backs the M/k tuning decision and the short-literal caveat in
# docs/LIMITATIONS.md.
[[bench]]
name = "grep_trigram"
harness = false

# Typed hierarchy edges P4 (docs/HIERARCHY-EDGES.md §8) — `implementations_index`
# (v8 section lookup) vs `implementations_live_walk` (pre-P3 tree-sitter
# re-parse) on a 150-implementer corpus, plus `subtypes_bfs` transitive-walk
# cost on a 20-level inheritance chain.
[[bench]]
name = "hierarchy"
harness = false
