[workspace]
members = [".", "crates/vex-mcp"]

[package]
name = "vex"
version = "1.14.1"
edition = "2021"
description = "Fast hybrid structural + semantic code search (vector + index)"
license = "MIT"
authors = ["Furcas <tenatarika@gmail.com>"]
repository = "https://github.com/tenatarika/vex"
homepage = "https://github.com/tenatarika/vex"
readme = "README.md"
rust-version = "1.88"

[[bin]]
name = "vex"
path = "src/main.rs"

[lib]
name = "vex"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Regex for content search
regex = "1.10"

# Tree-sitter core + language grammars
# Versions audited against crates.io latest. See docs/SUPPORTED_LANGUAGES.md.
tree-sitter = "0.26"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-md = "0.5"
tree-sitter-cpp = "0.23"
tree-sitter-php = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"

# Embedding generation (bundled ONNX Runtime + tokenizer + model download)
fastembed = "5.13"

# HNSW vector index
usearch = "2.25"

# FST for refs lookup (zero-copy, prefix/fuzzy search)
fst = { version = "0.4", features = ["levenshtein"] }

# Memory-mapped IO
memmap2 = "0.9"

# Parallel indexing
rayon = "1.10"

# Filesystem watching
notify = { version = "7.0", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Bloom filter
bloomfilter = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File walking
ignore = "0.4"

# Path globs for per-query --include/--exclude scope filters
globset = "0.4"

# Text diffing for `vex similar --explain` / `vex duplicates --explain`
similar = "2"

# SHA-256 for the MiniLM model integrity check (10.4)
sha2 = "0.10"

# File locking
fs2 = "0.4"

# Shell completions
clap_complete = "4.5"

# Self-update: fetches GitHub releases and replaces the running binary in place.
# `rustls` avoids the openssl C dependency so Windows builds stay
# self-contained. `signatures` enables ed25519 verification via zipsign so a
# compromised release / CDN cannot silently push a malicious binary.
self_update = { version = "0.42", default-features = false, features = [
    "rustls",
    "compression-flate2",
    "archive-tar",
    "signatures",
] }

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.41"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
# Needed by the P2 marker-cache tests to set an explicit mtime on a
# temp file — proves the fast path is taken when mtime + size match.
filetime = "0.2"

# Phase 13.2 Inc 7 — first Criterion benchmark in the repo. Establishes a
# latency baseline for the `vex bundle` modes (BFS, indegree scan, symbol
# assembly). Architect-review A10: revisit `pr-impact` rayon-ization if
# the BFS bench measures > 100 ms on the synthetic 50-change fixture.
[[bench]]
name = "bundle"
harness = false

# v1.13.0 — baseline benches for the open Performance items (P1 HNSW
# per-symbol reopen, P2 ONNX SHA on every --semantic, P5 vectors not
# L2-normalized at write time, P7 BTreeMap allocations in FST builders,
# P8 BM25 tokenizer allocations). Run before each P-item lands; diff
# against `benches/results/v1.13-baseline-<sha>.txt`.
[[bench]]
name = "perf_v113"
harness = false

# v1.14.0 — Pass-2 C++ #include-resolution micro-benches. Validates the
# architect's "~2-10s wall on Pass-2 for 50k-symbol corpus" estimate by
# isolating the two hot functions in `store::include_resolver`:
# `build_include_graph` (once per index build) and
# `resolve_via_include_bfs` (once per Unresolved C++ ref).
[[bench]]
name = "perf_v114"
harness = false
