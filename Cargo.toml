[workspace]
members = [".", "crates/vex-mcp"]

[package]
name = "vex"
version = "0.1.0"
edition = "2021"
description = "Fast hybrid structural + semantic code search (vector + index)"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "vex"
path = "src/main.rs"

[lib]
name = "vex"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Tree-sitter core + language grammars
tree-sitter = "0.24"
streaming-iterator = "0.1"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-kotlin = "0.3"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"

# Embedding generation (bundled ONNX Runtime + tokenizer + model download)
fastembed = "5.13"

# HNSW vector index
usearch = "2.25"

# Memory-mapped IO
memmap2 = "0.9"

# Parallel indexing
rayon = "1.10"

# Filesystem watching
notify = { version = "7.0", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Bloom filter
bloomfilter = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File walking
ignore = "0.4"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
insta = "1.41"
criterion = { version = "0.5", features = ["html_reports"] }
