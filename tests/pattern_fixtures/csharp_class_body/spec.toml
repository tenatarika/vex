lang = "csharp"
pattern = "public class $NAME { $$$BODY }"
exercises = "csharp_class_body"

# Post-H4: the matcher is depth-aware, so a nested `{ get; set; }`
# auto-property no longer truncates the BODY capture. The expected
# BODY now spans the entire class body including the auto-property.
[[expected]]
line = 1
captures = { NAME = "UserService", BODY = "public int counter;\n    public string Label { get; set; }" }
