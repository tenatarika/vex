name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Modern Xcode (16.3+, and the 26.x on current runners) dropped the static
      # libclang_rt.osx.a that rustc references via `-lclang_rt.osx`. Homebrew
      # LLVM still ships it; expose its dir via LIBRARY_PATH so the link resolves.
      - name: Provide static clang_rt.osx via Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          rt=$(find "$(brew --prefix llvm)/lib/clang" -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          [ -n "$rt" ] || { echo "::error::libclang_rt.osx.a not found under $(brew --prefix llvm)"; exit 1; }
          echo "clang_rt dir: $(dirname "$rt")"
          echo "LIBRARY_PATH=$(dirname "$rt")${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # `features` bakes a GPU execution provider into the shipped binary
        # (docs/GPU_SUPPORT.md §6): CoreML on macOS, DirectML on Windows — both
        # build on stock GPU-less runners and need no user SDK. Linux stays CPU
        # (no vendor-agnostic EP; CUDA needs a host SDK → source build only).
        # Runtime default is then Auto with silent CPU fallback.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: gpu-coreml
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: gpu-directml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # See the `test` job: expose Homebrew LLVM's static clang_rt.osx so the
      # aarch64-apple-darwin release link succeeds on Xcode-26 runners.
      - name: Provide static clang_rt.osx via Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          rt=$(find "$(brew --prefix llvm)/lib/clang" -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          [ -n "$rt" ] || { echo "::error::libclang_rt.osx.a not found under $(brew --prefix llvm)"; exit 1; }
          echo "clang_rt dir: $(dirname "$rt")"
          echo "LIBRARY_PATH=$(dirname "$rt")${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        # --workspace required: the root Cargo.toml is a hybrid workspace
        # (has both `[package]` for `vex` AND `[workspace.members]` listing
        # `crates/vex-mcp`). Without --workspace, cargo only builds the
        # root crate and `target/<triple>/release/vex-mcp` never exists —
        # which is exactly what the v1.11.2 release pipeline tripped on
        # when it tried to tar a non-existent vex-mcp binary.
        # `matrix.features` is "" on the Linux leg; empty string is FALSY in GHA
        # expressions, so the `|| ''` branch yields no --features there. The
        # ${{ }} is substituted by the runner before any shell runs, so this is
        # shell-agnostic (works on the bash and pwsh legs without pinning).
        run: cargo build --release --workspace --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # The DirectML EP needs the modern redistributable DirectML.dll beside the
      # exe. ORT downloads it into its binary cache during `cargo build`, but
      # `copy-dylibs` does NOT place it next to the binary (it only copies the
      # CUDA-style provider dylibs). Without this, the exe loads the stale in-box
      # C:\Windows\System32\DirectML.dll (DirectML 1.0-era), whose feature level
      # is too old for current ORT → DMLCreateDevice fails 887A0004 and the EP
      # silently falls back to CPU.
      #
      # Supply-chain pin: the candidate DLL is selected BY SHA-256, not by size —
      # the release tarball must never trust whatever happens to sit in the
      # runner's ort cache (a poisoned cache, a compromised transitive dep, or
      # two ort versions left by a dirty build could otherwise substitute a
      # different DLL silently). The pinned hash is the x64 DirectML.dll from
      # the official Microsoft.AI.DirectML 1.15.4 NuGet package — the version
      # ort =2.0.0-rc.12 stages (verified byte-identical against
      # https://www.nuget.org/packages/Microsoft.AI.DirectML/1.15.4).
      # On an ort upgrade that bumps DirectML, this step fails closed: recompute
      # the constant from the matching NuGet package, never from the cache alone.
      # See docs/GPU_SUPPORT.md §6.
      - name: Stage DirectML.dll (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # SHA-256 of bin/x64-win/DirectML.dll inside Microsoft.AI.DirectML 1.15.4 (18,527,776 bytes).
          DIRECTML_DLL_SHA256: "9C9E6D822561C6C41B90E6994B3E8857CF1D66DBFB1E0C4C799C7C89B4E92DA1"
        run: |
          $dest = "target/${{ matrix.target }}/release"
          $candidates = @(Get-ChildItem -Path "$env:LOCALAPPDATA\ort.pyke.io", $dest -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue)
          if (-not $candidates) {
            Write-Error "DirectML.dll not found in ort cache — the DirectML EP would silently fall back to CPU. Aborting release."
            exit 1
          }
          $dll = $candidates | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $env:DIRECTML_DLL_SHA256 } | Select-Object -First 1
          if (-not $dll) {
            Write-Host "Candidates found (none matched the pinned SHA-256):"
            foreach ($c in $candidates) {
              Write-Host ("  {0}  size={1}  sha256={2}" -f $c.FullName, $c.Length, (Get-FileHash $c.FullName -Algorithm SHA256).Hash)
            }
            Write-Error "No DirectML.dll matched the pinned SHA-256 ($env:DIRECTML_DLL_SHA256). If ort bumped its DirectML version, recompute the pin from the official Microsoft.AI.DirectML NuGet package. Aborting release."
            exit 1
          }
          Copy-Item $dll.FullName (Join-Path $dest "DirectML.dll") -Force
          # Re-verify the staged copy — guards against a corrupt/raced copy.
          $staged = Get-FileHash (Join-Path $dest "DirectML.dll") -Algorithm SHA256
          if ($staged.Hash -ne $env:DIRECTML_DLL_SHA256) {
            Write-Error "Staged DirectML.dll hash mismatch after copy ($($staged.Hash)). Aborting release."
            exit 1
          }
          Write-Host ("staged DirectML.dll {0:N1} MB from {1} (sha256 verified)" -f ($dll.Length / 1MB), $dll.FullName)

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        # Each binary ships as a separate tarball. `vex self-update`
        # (releases after v1.16.0) installs EVERYTHING in
        # `vex-<target>.tar.gz`: the `vex` binary is self-replaced and
        # every other file is treated as a sidecar installed beside the
        # exe. `vex-mcp` therefore cannot live in this archive —
        # self-update would start installing it as a sidecar next to
        # `vex`. The separate `vex-mcp-<target>` archive keeps both
        # installable from the GitHub release page.
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vex-${{ matrix.target }}.tar.gz vex
          tar czf ../../../vex-mcp-${{ matrix.target }}.tar.gz vex-mcp
          cd ../../..

      # Symmetric to the Windows smoke test below. A unix packaging
      # regression (wrong cd, wrong binary name, missing chmod) would
      # otherwise slip through to release-day and only surface when a
      # user's `tar -xzf` finds nothing executable.
      - name: Verify unix tarballs are extractable
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          for name in vex vex-mcp; do
            archive="${name}-${{ matrix.target }}.tar.gz"
            dir="smoke-${name}"
            mkdir -p "${dir}"
            tar -xzf "${archive}" -C "${dir}"
            if [ ! -x "${dir}/${name}" ]; then
              echo "FAIL: ${dir}/${name} missing or not executable after tar extract" >&2
              exit 1
            fi
            echo "OK: ${archive} extracts cleanly"
          done

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Switched from .zip → .tar.gz at v1.9.2 (review Section 7 fix).
        # `self_update 0.42/0.44` does not strip zipsign's 80-byte signature
        # prefix before handing the file to `ZipArchive::new`, breaking
        # `vex self-update` for every Windows user since v1.8.2 with
        # "Compression method not supported". The tar.gz path used on
        # macOS / Linux works end-to-end (zipsign + self_update both
        # handle tar.gz correctly), so we unify on it. `tar` is
        # preinstalled on windows-latest runners (bsdtar). Push-Location
        # keeps the archive entry as bare `vex.exe`, not
        # `target/.../release/vex.exe`. v1.11.2 added the parallel
        # `vex-mcp-…tar.gz` to fix the Windows MCP install gap: before
        # this, every Windows user wanting the MCP server had to install
        # rustup and `cargo build --release -p vex-search-mcp` themselves.
        run: |
          Push-Location target/${{ matrix.target }}/release
          # vex.exe ships with DirectML.dll (the GPU EP's runtime dep, staged
          # above). vex-mcp.exe spawns the `vex` CLI as a subprocess and never
          # loads ORT itself, so it needs no DLL. `vex self-update` (releases
          # after v1.16.0) installs every non-binary file in this archive as a
          # sidecar beside the exe — so the DLL now reaches BOTH fresh installs
          # (manual untar / brew) and self-updates, and an install degraded by
          # an older binary-only updater is healed on its next self-update.
          # Consequence: never add a file to this tarball that must not land
          # next to vex.exe on update. See GPU_SUPPORT.md §6.
          tar -czf "../../../vex-${{ matrix.target }}.tar.gz" vex.exe DirectML.dll
          tar -czf "../../../vex-mcp-${{ matrix.target }}.tar.gz" vex-mcp.exe
          Pop-Location

      # Post-pack smoke test: extract each freshly packed tarball into a
      # scratch dir and assert the expected binary is present. Catches
      # the class of bug Section 7 documented — a packaging step that
      # "succeeds" but emits an archive `self_update` can't reopen.
      # Sign-time verification happens later in the `release` job; this
      # guard runs before upload-artifact so a bad pack fails the
      # matrix leg.
      - name: Verify Windows tarballs are extractable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($name in @("vex", "vex-mcp")) {
            $exe = "$name.exe"
            $tar = "$name-${{ matrix.target }}.tar.gz"
            $dir = "smoke-$name"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            tar -xzf $tar -C $dir
            if (-not (Test-Path "$dir/$exe")) {
              Write-Error "FAIL: $dir/$exe missing after tar extract"
              exit 1
            }
            Write-Host "OK: $tar extracts cleanly"
          }
          # The GPU EP's DirectML.dll must ride along in the vex archive, or
          # every fresh Windows install silently runs on CPU.
          if (-not (Test-Path "smoke-vex/DirectML.dll")) {
            Write-Error "FAIL: DirectML.dll missing from vex archive — DirectML EP would not load"
            exit 1
          }
          Write-Host "OK: DirectML.dll present in vex archive"

      - uses: actions/upload-artifact@v4
        with:
          name: vex-${{ matrix.target }}
          path: vex-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vex-mcp-${{ matrix.target }}
          path: vex-mcp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # MCP Bundles (.mcpb) for the MCP Registry — one per target, built from the
  # SAME tarballs the build matrix produced (no second compile), so a bundle
  # can never drift from the release binaries. Each bundle holds manifest.json
  # + server/{vex,vex-mcp} (+ DirectML.dll on Windows, which rides inside
  # vex-<target>.tar.gz). Named `vex-mcp-<target>.mcpb`, never
  # `vex-<target>.mcpb`: `vex self-update` picks its asset by
  # `name.contains("vex-<target>")`. Also renders server.json with each
  # bundle's SHA-256 for the `publish-mcp-registry` job. Packing on Linux
  # keeps the 0755 mode build-bundle.sh sets on the unix binaries.
  # See docs/RELEASING.md "MCP Registry".
  #
  # Nothing in the core release depends on this job: `release` and
  # `update-homebrew` run whether or not it succeeds, and the bundles reach
  # the GitHub release through `attach-mcpb`.
  mcpb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: vex-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The mcpb CLI comes from the committed lockfile (exact version +
      # integrity hashes for the whole dependency tree), never a floating
      # `npx` resolve. --ignore-scripts: no install-time code runs.
      - name: Install mcpb CLI
        run: npm ci --ignore-scripts --prefix packaging/mcpb

      - name: Build MCP bundles and render server.json
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            mkdir -p "stage/${t}/server"
            tar -xzf "dist/vex-${t}.tar.gz" -C "stage/${t}/server"
            tar -xzf "dist/vex-mcp-${t}.tar.gz" -C "stage/${t}/server"
            packaging/mcpb/build-bundle.sh "${t}" "${version}" "stage/${t}" bundles
          done
          # The tag drives the bundle/registry version; the binaries carry
          # their own. Refuse to ship a bundle whose binary disagrees. A
          # tag-checkout build prints the git-describe form `vex v1.2.3`; a
          # build without .git prints Cargo's `vex 1.2.3`. Anything else
          # (e.g. `vex v1.2.3-4-gabc`, a build off a later commit) fails.
          got="$(stage/x86_64-unknown-linux-gnu/server/vex --version)"
          if [ "${got}" != "vex ${version}" ] && [ "${got}" != "vex v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match \`vex --version\` (${got})"
            exit 1
          fi
          packaging/mcpb/render-server-json.sh "${version}" bundles > bundles/server.rendered.json
          (cd bundles && sha256sum ./*.mcpb)
          cat bundles/server.rendered.json

      # Same idea as the tarball smoke tests in `build`: unpack what we
      # are about to publish and check the parts a host needs.
      - name: Verify bundles
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            dir="check/${t}"
            mkdir -p "${dir}"
            unzip -q "bundles/vex-mcp-${t}.mcpb" -d "${dir}"
            jq -e '.server.type == "binary" and .name == "vex"' "${dir}/manifest.json" >/dev/null
            case "${t}" in
              *windows*)
                for f in vex.exe vex-mcp.exe DirectML.dll; do
                  [ -f "${dir}/server/${f}" ] || { echo "::error::${t}: server/${f} missing"; exit 1; }
                done ;;
              *)
                for f in vex vex-mcp; do
                  [ -x "${dir}/server/${f}" ] || { echo "::error::${t}: server/${f} missing or not executable"; exit 1; }
                done ;;
            esac
            echo "OK: vex-mcp-${t}.mcpb"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: |
            bundles/*.mcpb
            bundles/server.rendered.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required so git-cliff sees every commit and tag
      # between the previous release and the one we're cutting now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the build matrix's tarballs (artifacts `vex-<t>` and
      # `vex-mcp-<t>`); the `mcpb` artifact is attached by `attach-mcpb`.
      - uses: actions/download-artifact@v4
        with:
          pattern: vex-*
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install zipsign
        run: cargo install zipsign --version "^0.2" --locked

      # The private key is stored in repo Secrets as the raw 64-byte file
      # contents, base64-encoded. We decode it to a tmpfile, sign each
      # archive, then shred the tmpfile so the key never lands on a
      # disk image the runner could reuse.
      - name: Sign release archives
        env:
          ZIPSIGN_PRIVATE_KEY_B64: ${{ secrets.ZIPSIGN_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ZIPSIGN_PRIVATE_KEY_B64}" ]; then
            echo "::error::ZIPSIGN_PRIVATE_KEY_B64 secret is not set — refusing to publish an unsigned release"
            exit 1
          fi
          keyfile="$(mktemp)"
          trap 'shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"' EXIT
          printf '%s' "$ZIPSIGN_PRIVATE_KEY_B64" | base64 -d > "$keyfile"
          # Section 7 fix (v1.9.2): every platform now ships as .tar.gz.
          # The previous .zip path on Windows is gone — see
          # `Package (windows)` in the `build` job for the rationale.
          for f in vex-*.tar.gz; do
            [ -f "$f" ] && zipsign sign tar "$f" "$keyfile"
          done

      # orhun/git-cliff-action@v3 was originally used here, but its
      # Docker base image (debian:buster) is now EOL — `apt-get update`
      # fails because the buster repositories returned 404. Install the
      # tool directly instead; taiki-e/install-action fetches the
      # prebuilt binary from the git-cliff release assets, so there is
      # no Docker base layer to bitrot.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release body
        run: git-cliff --config cliff.toml --strip header --latest -o release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: vex-*.tar.gz

  # Attach the MCP Bundles to the release `release` just created. Separate
  # from `release` so an MCPB/registry problem can never block the signed
  # tarballs or Homebrew. The bundles are NOT zipsigned: self-update never
  # downloads them, and the registry pins each one by SHA-256 instead.
  #
  # Re-run behaviour: an asset that is already attached is compared byte for
  # byte (SHA-256) — identical → skip, different → FAIL. No --clobber: once a
  # version is in the registry its listing pins the old hash, so silently
  # replacing a bundle would make that listing uninstallable. A re-run of
  # `mcpb` (fresh zip timestamps → new hashes) therefore needs the old
  # assets deleted by hand first, and only before the registry publish.
  attach-mcpb:
    needs: [release, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: mcpb

      - name: Upload bundles to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          count=0
          for bundle in mcpb/vex-mcp-*.mcpb; do
            name="${bundle##*/}"
            count=$((count + 1))
            if grep -qxF "${name}" <<<"${existing}"; then
              rm -rf live && mkdir live
              gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "${name}" --dir live
              want="$(sha256sum "${bundle}" | cut -d' ' -f1)"
              got="$(sha256sum "live/${name}" | cut -d' ' -f1)"
              if [ "${want}" != "${got}" ]; then
                echo "::error::${name} is already attached with different bytes (attached ${got}, built ${want}). Delete the old asset by hand if it is not yet in the MCP Registry; see docs/RELEASING.md."
                exit 1
              fi
              echo "OK: ${name} already attached, identical"
            else
              gh release upload "${GITHUB_REF_NAME}" "${bundle}" --repo "${GITHUB_REPOSITORY}"
              echo "OK: ${name} uploaded"
            fi
          done
          if [ "${count}" -ne 3 ]; then
            echo "::error::expected 3 bundles in the mcpb artifact, found ${count}"
            exit 1
          fi

  # Generate a prebuilt-binary Homebrew formula so `brew install` unpacks
  # the platform-specific tarball produced by the build matrix above
  # instead of running `cargo install` from source. Source builds pulled
  # ~300 deps including ring + fastembed + ort, which OOM-killed clang
  # on memory-constrained boxes and forced every brew user through a
  # ~5-minute compile cycle — fixed 2026-05-26 after a tester on M4 Pro
  # hit the `Killed: 9` failure path.
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> $GITHUB_OUTPUT

      - name: Download prebuilt archives and compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          BASE="https://github.com/tenatarika/vex/releases/download/${{ steps.version.outputs.tag }}"

          curl -sL --fail "${BASE}/vex-aarch64-apple-darwin.tar.gz" -o mac-arm.tar.gz
          curl -sL --fail "${BASE}/vex-x86_64-unknown-linux-gnu.tar.gz" -o linux-x86.tar.gz

          {
            echo "mac_arm=$(sha256sum mac-arm.tar.gz | cut -d' ' -f1)"
            echo "linux_x86=$(sha256sum linux-x86.tar.gz | cut -d' ' -f1)"
          } >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tenatarika/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate prebuilt-binary Formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
        run: |
          set -euo pipefail
          cd homebrew-tap

          # Full formula regeneration via heredoc — `sed`-patching only
          # the url/sha lines (the old approach) couldn't introduce the
          # `on_macos { on_arm { ... } }` / `on_linux { on_intel { ... } }`
          # structure needed for platform-specific prebuilt URLs.
          cat > Formula/vex.rb <<EOF
          class Vex < Formula
            desc "Fast hybrid structural + semantic code search (vector + index)"
            homepage "https://github.com/tenatarika/vex"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            head do
              url "https://github.com/tenatarika/vex.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                # Match the prebuilt bottle: bake CoreML into macOS source
                # builds. Linux --HEAD stays CPU (no vendor-agnostic EP; CUDA
                # needs a host SDK). See docs/GPU_SUPPORT.md §6.
                args = std_cargo_args
                args += ["--features", "gpu-coreml"] if OS.mac?
                system "cargo", "install", *args
              else
                bin.install "vex"
              end
            end

            test do
              # The prebuilt binary is built from the tag checkout and prints
              # the git-describe form "vex v1.27.2"; also accept the bare
              # "vex 1.27.2" of a build without .git. (No backticks in this
              # heredoc: it is unquoted, so the shell would run them.)
              assert_match(/\Avex v?#{Regexp.escape(version.to_s)}\z/, shell_output("#{bin}/vex --version").strip)
            end
          end
          EOF
          cat Formula/vex.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vex.rb
          git commit -m "bump vex to ${{ steps.version.outputs.tag }} (prebuilt)"
          git push

  # Publish server.json to the official MCP Registry
  # (registry.modelcontextprotocol.io). Runs AFTER `attach-mcpb` because the
  # registry HEAD-checks every package URL at publish time, and a version can
  # be published exactly ONCE — so this job is written to be safely re-run:
  # it treats "this exact version with these exact hashes is already listed"
  # as success, and fails loudly if the version exists with different hashes
  # (that needs a new patch release, never a re-publish). Prerelease tags
  # (v1.2.3-rc.1) are skipped. Auth is GitHub OIDC (namespace
  # io.github.tenatarika/*), so no secret is involved.
  # Manual fallback + failure modes: docs/RELEASING.md "MCP Registry".
  publish-mcp-registry:
    needs: attach-mcpb
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVER_NAME: io.github.tenatarika/vex
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      MCP_PUBLISHER_VERSION: v1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz from the v1.8.1 release
      # (matches the digest GitHub reports for the asset).
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: mcpb

      - name: Check server.json is for this tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg v "${version}" --arg n "${SERVER_NAME}" \
            '.name == $n and .version == $v and (.packages | length) == 3 and all(.packages[]; .version == $v)' \
            mcpb/server.rendered.json >/dev/null \
            || { echo "::error::server.rendered.json does not describe ${SERVER_NAME} ${version}"; exit 1; }

      # The registry stores the hash; MCP hosts compare it to what they
      # download. Re-hash the LIVE release assets (not the local artifact) so
      # a re-uploaded or mangled asset fails here instead of on users.
      - name: Verify live release assets against server.json
        run: |
          set -euo pipefail
          count=0
          while read -r want url; do
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o asset.mcpb "${url}"
            got="$(sha256sum asset.mcpb | cut -d' ' -f1)"
            if [ "${got}" != "${want}" ]; then
              echo "::error::sha256 mismatch for ${url}: server.json ${want}, live ${got}"
              exit 1
            fi
            echo "OK: ${url##*/} ${got}"
            count=$((count + 1))
          done < <(jq -r '.packages[] | "\(.fileSha256) \(.identifier)"' mcpb/server.rendered.json)
          rm -f asset.mcpb
          # A jq failure inside the process substitution would just end the
          # loop early; the count catches it.
          if [ "${count}" -ne 3 ]; then
            echo "::error::verified ${count} bundle URLs, expected 3"
            exit 1
          fi

      - name: Check whether this version is already published
        id: existing
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="${REGISTRY_URL}/v0/servers/${SERVER_NAME//\//%2F}/versions/${version}"
          code="$(curl -sS --retry 3 --connect-timeout 10 --max-time 60 -o existing.json -w '%{http_code}' "${url}")"
          case "${code}" in
            404)
              echo "published=false" >> "$GITHUB_OUTPUT" ;;
            200)
              want="$(jq -S '[.packages[] | {identifier, fileSha256}] | sort_by(.identifier)' mcpb/server.rendered.json)"
              # Tolerate both the wrapped ({server, _meta}) and a bare
              # server.json body, and a listing without packages.
              have="$(jq -S '[((.server // .).packages // [])[] | {identifier, fileSha256}] | sort_by(.identifier)' existing.json)"
              if [ "${want}" = "${have}" ]; then
                echo "${SERVER_NAME} ${version} is already in the registry with identical packages — nothing to do."
                echo "published=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::${SERVER_NAME} ${version} is already in the registry with DIFFERENT packages. A version can be published only once — cut a new patch release."
                diff <(echo "${have}") <(echo "${want}") || true
                exit 1
              fi ;;
            *)
              echo "::error::unexpected HTTP ${code} from ${url}"
              cat existing.json || true
              exit 1 ;;
          esac

      - name: Install mcp-publisher
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate and publish
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          ./mcp-publisher validate mcpb/server.rendered.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcpb/server.rendered.json
