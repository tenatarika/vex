name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vex-${{ matrix.target }}.tar.gz vex
          cd ../../..

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # 7z (preinstalled on windows-latest) with explicit -mm=Deflate
        # avoids the Deflate64 archives that `Compress-Archive` emits on
        # some pwsh 7.x configurations — those decompress fine with .NET
        # but fail in the zip crate used by self_update with
        # "Compression method not supported". v1.6.2 self-update was
        # bitten by this on Windows. Push-Location keeps the archive
        # entry as bare `vex.exe`, not `target/.../release/vex.exe`.
        run: |
          Push-Location target/${{ matrix.target }}/release
          7z a -tzip -mm=Deflate -mx=5 "../../../vex-${{ matrix.target }}.zip" vex.exe
          Pop-Location

      # Regression guard for the v1.6.2 Windows self-update failure: every
      # entry in the release zip MUST use compression method 8 (Deflate).
      # Method 9 (Deflate64) is silently emitted by some Compress-Archive
      # configurations and breaks `vex self-update` even though .NET
      # extraction works. Fails the release loudly instead.
      - name: Verify zip uses Deflate (not Deflate64)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -c @"
          import sys, zipfile
          archive = 'vex-${{ matrix.target }}.zip'
          z = zipfile.ZipFile(archive)
          names = {8: 'Deflate', 9: 'Deflate64', 0: 'Stored', 12: 'Bzip2', 14: 'LZMA', 93: 'Zstd'}
          bad = []
          for info in z.infolist():
              if info.compress_type != 8:
                  method_name = names.get(info.compress_type, 'unknown')
                  bad.append(f'{info.filename}: method={info.compress_type} ({method_name})')
          if bad:
              print(f'FAIL: {archive} has entries not using Deflate:')
              for b in bad: print(f'  {b}')
              sys.exit(1)
          print(f'OK: {len(z.namelist())} entry(ies) in {archive} use Deflate (method 8)')
          "@

      - uses: actions/upload-artifact@v4
        with:
          name: vex-${{ matrix.target }}
          path: |
            vex-${{ matrix.target }}.tar.gz
            vex-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required so git-cliff sees every commit and tag
      # between the previous release and the one we're cutting now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install zipsign
        run: cargo install zipsign --version "^0.2" --locked

      # The private key is stored in repo Secrets as the raw 64-byte file
      # contents, base64-encoded. We decode it to a tmpfile, sign each
      # archive, then shred the tmpfile so the key never lands on a
      # disk image the runner could reuse.
      - name: Sign release archives
        env:
          ZIPSIGN_PRIVATE_KEY_B64: ${{ secrets.ZIPSIGN_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ZIPSIGN_PRIVATE_KEY_B64}" ]; then
            echo "::error::ZIPSIGN_PRIVATE_KEY_B64 secret is not set — refusing to publish an unsigned release"
            exit 1
          fi
          keyfile="$(mktemp)"
          trap 'shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"' EXIT
          printf '%s' "$ZIPSIGN_PRIVATE_KEY_B64" | base64 -d > "$keyfile"
          for f in vex-*.tar.gz; do
            [ -f "$f" ] && zipsign sign tar "$f" "$keyfile"
          done
          for f in vex-*.zip; do
            [ -f "$f" ] && zipsign sign zip "$f" "$keyfile"
          done

      # orhun/git-cliff-action@v3 was originally used here, but its
      # Docker base image (debian:buster) is now EOL — `apt-get update`
      # fails because the buster repositories returned 404. Install the
      # tool directly instead; taiki-e/install-action fetches the
      # prebuilt binary from the git-cliff release assets, so there is
      # no Docker base layer to bitrot.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release body
        run: git-cliff --config cliff.toml --strip header --latest -o release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            vex-*.tar.gz
            vex-*.zip

  # Generate a prebuilt-binary Homebrew formula so `brew install` unpacks
  # the platform-specific tarball produced by the build matrix above
  # instead of running `cargo install` from source. Source builds pulled
  # ~300 deps including ring + fastembed + ort, which OOM-killed clang
  # on memory-constrained boxes and forced every brew user through a
  # ~5-minute compile cycle — fixed 2026-05-26 after a tester on M4 Pro
  # hit the `Killed: 9` failure path.
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> $GITHUB_OUTPUT

      - name: Download prebuilt archives and compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          BASE="https://github.com/tenatarika/vex/releases/download/${{ steps.version.outputs.tag }}"

          curl -sL --fail "${BASE}/vex-aarch64-apple-darwin.tar.gz" -o mac-arm.tar.gz
          curl -sL --fail "${BASE}/vex-x86_64-unknown-linux-gnu.tar.gz" -o linux-x86.tar.gz

          {
            echo "mac_arm=$(sha256sum mac-arm.tar.gz | cut -d' ' -f1)"
            echo "linux_x86=$(sha256sum linux-x86.tar.gz | cut -d' ' -f1)"
          } >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tenatarika/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate prebuilt-binary Formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
        run: |
          set -euo pipefail
          cd homebrew-tap

          # Full formula regeneration via heredoc — `sed`-patching only
          # the url/sha lines (the old approach) couldn't introduce the
          # `on_macos { on_arm { ... } }` / `on_linux { on_intel { ... } }`
          # structure needed for platform-specific prebuilt URLs.
          cat > Formula/vex.rb <<EOF
          class Vex < Formula
            desc "Fast hybrid structural + semantic code search (vector + index)"
            homepage "https://github.com/tenatarika/vex"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            head do
              url "https://github.com/tenatarika/vex.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                system "cargo", "install", *std_cargo_args
              else
                bin.install "vex"
              end
            end

            test do
              assert_match "vex #{version}", shell_output("#{bin}/vex --version")
            end
          end
          EOF
          cat Formula/vex.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vex.rb
          git commit -m "bump vex to ${{ steps.version.outputs.tag }} (prebuilt)"
          git push
