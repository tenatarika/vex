name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Modern Xcode (16.3+, and the 26.x on current runners) dropped the static
      # libclang_rt.osx.a that rustc references via `-lclang_rt.osx`. Homebrew
      # LLVM still ships it; expose its dir via LIBRARY_PATH so the link resolves.
      - name: Provide static clang_rt.osx via Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          rt=$(find "$(brew --prefix llvm)/lib/clang" -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          [ -n "$rt" ] || { echo "::error::libclang_rt.osx.a not found under $(brew --prefix llvm)"; exit 1; }
          echo "clang_rt dir: $(dirname "$rt")"
          echo "LIBRARY_PATH=$(dirname "$rt")${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # `features` bakes a GPU execution provider into the shipped binary
        # (docs/GPU_SUPPORT.md §6): CoreML on macOS, DirectML on Windows — both
        # build on stock GPU-less runners and need no user SDK. Linux stays CPU
        # (no vendor-agnostic EP; CUDA needs a host SDK → source build only).
        # Runtime default is then Auto with silent CPU fallback.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: gpu-coreml
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: gpu-directml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # See the `test` job: expose Homebrew LLVM's static clang_rt.osx so the
      # aarch64-apple-darwin release link succeeds on Xcode-26 runners.
      - name: Provide static clang_rt.osx via Homebrew LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          rt=$(find "$(brew --prefix llvm)/lib/clang" -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          [ -n "$rt" ] || { echo "::error::libclang_rt.osx.a not found under $(brew --prefix llvm)"; exit 1; }
          echo "clang_rt dir: $(dirname "$rt")"
          echo "LIBRARY_PATH=$(dirname "$rt")${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        # --workspace required: the root Cargo.toml is a hybrid workspace
        # (has both `[package]` for `vex` AND `[workspace.members]` listing
        # `crates/vex-mcp`). Without --workspace, cargo only builds the
        # root crate and `target/<triple>/release/vex-mcp` never exists —
        # which is exactly what the v1.11.2 release pipeline tripped on
        # when it tried to tar a non-existent vex-mcp binary.
        # `matrix.features` is "" on the Linux leg; empty string is FALSY in GHA
        # expressions, so the `|| ''` branch yields no --features there. The
        # ${{ }} is substituted by the runner before any shell runs, so this is
        # shell-agnostic (works on the bash and pwsh legs without pinning).
        run: cargo build --release --workspace --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # The DirectML EP needs the modern redistributable DirectML.dll beside the
      # exe. ORT downloads it into its binary cache during `cargo build`, but
      # `copy-dylibs` does NOT place it next to the binary (it only copies the
      # CUDA-style provider dylibs). Without this, the exe loads the stale in-box
      # C:\Windows\System32\DirectML.dll (DirectML 1.0-era), whose feature level
      # is too old for current ORT → DMLCreateDevice fails 887A0004 and the EP
      # silently falls back to CPU.
      #
      # Supply-chain pin: the candidate DLL is selected BY SHA-256, not by size —
      # the release tarball must never trust whatever happens to sit in the
      # runner's ort cache (a poisoned cache, a compromised transitive dep, or
      # two ort versions left by a dirty build could otherwise substitute a
      # different DLL silently). The pinned hash is the x64 DirectML.dll from
      # the official Microsoft.AI.DirectML 1.15.4 NuGet package — the version
      # ort =2.0.0-rc.12 stages (verified byte-identical against
      # https://www.nuget.org/packages/Microsoft.AI.DirectML/1.15.4).
      # On an ort upgrade that bumps DirectML, this step fails closed: recompute
      # the constant from the matching NuGet package, never from the cache alone.
      # See docs/GPU_SUPPORT.md §6.
      - name: Stage DirectML.dll (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # SHA-256 of bin/x64-win/DirectML.dll inside Microsoft.AI.DirectML 1.15.4 (18,527,776 bytes).
          DIRECTML_DLL_SHA256: "9C9E6D822561C6C41B90E6994B3E8857CF1D66DBFB1E0C4C799C7C89B4E92DA1"
        run: |
          $dest = "target/${{ matrix.target }}/release"
          $candidates = @(Get-ChildItem -Path "$env:LOCALAPPDATA\ort.pyke.io", $dest -Recurse -Filter DirectML.dll -ErrorAction SilentlyContinue)
          if (-not $candidates) {
            Write-Error "DirectML.dll not found in ort cache — the DirectML EP would silently fall back to CPU. Aborting release."
            exit 1
          }
          $dll = $candidates | Where-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash -eq $env:DIRECTML_DLL_SHA256 } | Select-Object -First 1
          if (-not $dll) {
            Write-Host "Candidates found (none matched the pinned SHA-256):"
            foreach ($c in $candidates) {
              Write-Host ("  {0}  size={1}  sha256={2}" -f $c.FullName, $c.Length, (Get-FileHash $c.FullName -Algorithm SHA256).Hash)
            }
            Write-Error "No DirectML.dll matched the pinned SHA-256 ($env:DIRECTML_DLL_SHA256). If ort bumped its DirectML version, recompute the pin from the official Microsoft.AI.DirectML NuGet package. Aborting release."
            exit 1
          }
          Copy-Item $dll.FullName (Join-Path $dest "DirectML.dll") -Force
          # Re-verify the staged copy — guards against a corrupt/raced copy.
          $staged = Get-FileHash (Join-Path $dest "DirectML.dll") -Algorithm SHA256
          if ($staged.Hash -ne $env:DIRECTML_DLL_SHA256) {
            Write-Error "Staged DirectML.dll hash mismatch after copy ($($staged.Hash)). Aborting release."
            exit 1
          }
          Write-Host ("staged DirectML.dll {0:N1} MB from {1} (sha256 verified)" -f ($dll.Length / 1MB), $dll.FullName)

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        # Each binary ships as a separate tarball. `vex self-update`
        # (releases after v1.16.0) installs EVERYTHING in
        # `vex-<target>.tar.gz`: the `vex` binary is self-replaced and
        # every other file is treated as a sidecar installed beside the
        # exe. `vex-mcp` therefore cannot live in this archive —
        # self-update would start installing it as a sidecar next to
        # `vex`. The separate `vex-mcp-<target>` archive keeps both
        # installable from the GitHub release page.
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vex-${{ matrix.target }}.tar.gz vex
          tar czf ../../../vex-mcp-${{ matrix.target }}.tar.gz vex-mcp
          cd ../../..

      # Symmetric to the Windows smoke test below. A unix packaging
      # regression (wrong cd, wrong binary name, missing chmod) would
      # otherwise slip through to release-day and only surface when a
      # user's `tar -xzf` finds nothing executable.
      - name: Verify unix tarballs are extractable
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          for name in vex vex-mcp; do
            archive="${name}-${{ matrix.target }}.tar.gz"
            dir="smoke-${name}"
            mkdir -p "${dir}"
            tar -xzf "${archive}" -C "${dir}"
            if [ ! -x "${dir}/${name}" ]; then
              echo "FAIL: ${dir}/${name} missing or not executable after tar extract" >&2
              exit 1
            fi
            echo "OK: ${archive} extracts cleanly"
          done

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Switched from .zip → .tar.gz at v1.9.2 (review Section 7 fix).
        # `self_update 0.42/0.44` does not strip zipsign's 80-byte signature
        # prefix before handing the file to `ZipArchive::new`, breaking
        # `vex self-update` for every Windows user since v1.8.2 with
        # "Compression method not supported". The tar.gz path used on
        # macOS / Linux works end-to-end (zipsign + self_update both
        # handle tar.gz correctly), so we unify on it. `tar` is
        # preinstalled on windows-latest runners (bsdtar). Push-Location
        # keeps the archive entry as bare `vex.exe`, not
        # `target/.../release/vex.exe`. v1.11.2 added the parallel
        # `vex-mcp-…tar.gz` to fix the Windows MCP install gap: before
        # this, every Windows user wanting the MCP server had to install
        # rustup and `cargo build --release -p vex-mcp` themselves.
        run: |
          Push-Location target/${{ matrix.target }}/release
          # vex.exe ships with DirectML.dll (the GPU EP's runtime dep, staged
          # above). vex-mcp.exe spawns the `vex` CLI as a subprocess and never
          # loads ORT itself, so it needs no DLL. `vex self-update` (releases
          # after v1.16.0) installs every non-binary file in this archive as a
          # sidecar beside the exe — so the DLL now reaches BOTH fresh installs
          # (manual untar / brew) and self-updates, and an install degraded by
          # an older binary-only updater is healed on its next self-update.
          # Consequence: never add a file to this tarball that must not land
          # next to vex.exe on update. See GPU_SUPPORT.md §6.
          tar -czf "../../../vex-${{ matrix.target }}.tar.gz" vex.exe DirectML.dll
          tar -czf "../../../vex-mcp-${{ matrix.target }}.tar.gz" vex-mcp.exe
          Pop-Location

      # Post-pack smoke test: extract each freshly packed tarball into a
      # scratch dir and assert the expected binary is present. Catches
      # the class of bug Section 7 documented — a packaging step that
      # "succeeds" but emits an archive `self_update` can't reopen.
      # Sign-time verification happens later in the `release` job; this
      # guard runs before upload-artifact so a bad pack fails the
      # matrix leg.
      - name: Verify Windows tarballs are extractable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          foreach ($name in @("vex", "vex-mcp")) {
            $exe = "$name.exe"
            $tar = "$name-${{ matrix.target }}.tar.gz"
            $dir = "smoke-$name"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            tar -xzf $tar -C $dir
            if (-not (Test-Path "$dir/$exe")) {
              Write-Error "FAIL: $dir/$exe missing after tar extract"
              exit 1
            }
            Write-Host "OK: $tar extracts cleanly"
          }
          # The GPU EP's DirectML.dll must ride along in the vex archive, or
          # every fresh Windows install silently runs on CPU.
          if (-not (Test-Path "smoke-vex/DirectML.dll")) {
            Write-Error "FAIL: DirectML.dll missing from vex archive — DirectML EP would not load"
            exit 1
          }
          Write-Host "OK: DirectML.dll present in vex archive"

      - uses: actions/upload-artifact@v4
        with:
          name: vex-${{ matrix.target }}
          path: vex-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vex-mcp-${{ matrix.target }}
          path: vex-mcp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required so git-cliff sees every commit and tag
      # between the previous release and the one we're cutting now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install zipsign
        run: cargo install zipsign --version "^0.2" --locked

      # The private key is stored in repo Secrets as the raw 64-byte file
      # contents, base64-encoded. We decode it to a tmpfile, sign each
      # archive, then shred the tmpfile so the key never lands on a
      # disk image the runner could reuse.
      - name: Sign release archives
        env:
          ZIPSIGN_PRIVATE_KEY_B64: ${{ secrets.ZIPSIGN_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ZIPSIGN_PRIVATE_KEY_B64}" ]; then
            echo "::error::ZIPSIGN_PRIVATE_KEY_B64 secret is not set — refusing to publish an unsigned release"
            exit 1
          fi
          keyfile="$(mktemp)"
          trap 'shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"' EXIT
          printf '%s' "$ZIPSIGN_PRIVATE_KEY_B64" | base64 -d > "$keyfile"
          # Section 7 fix (v1.9.2): every platform now ships as .tar.gz.
          # The previous .zip path on Windows is gone — see
          # `Package (windows)` in the `build` job for the rationale.
          for f in vex-*.tar.gz; do
            [ -f "$f" ] && zipsign sign tar "$f" "$keyfile"
          done

      # orhun/git-cliff-action@v3 was originally used here, but its
      # Docker base image (debian:buster) is now EOL — `apt-get update`
      # fails because the buster repositories returned 404. Install the
      # tool directly instead; taiki-e/install-action fetches the
      # prebuilt binary from the git-cliff release assets, so there is
      # no Docker base layer to bitrot.
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release body
        run: git-cliff --config cliff.toml --strip header --latest -o release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: vex-*.tar.gz

  # Generate a prebuilt-binary Homebrew formula so `brew install` unpacks
  # the platform-specific tarball produced by the build matrix above
  # instead of running `cargo install` from source. Source builds pulled
  # ~300 deps including ring + fastembed + ort, which OOM-killed clang
  # on memory-constrained boxes and forced every brew user through a
  # ~5-minute compile cycle — fixed 2026-05-26 after a tester on M4 Pro
  # hit the `Killed: 9` failure path.
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
          } >> $GITHUB_OUTPUT

      - name: Download prebuilt archives and compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          BASE="https://github.com/tenatarika/vex/releases/download/${{ steps.version.outputs.tag }}"

          curl -sL --fail "${BASE}/vex-aarch64-apple-darwin.tar.gz" -o mac-arm.tar.gz
          curl -sL --fail "${BASE}/vex-x86_64-unknown-linux-gnu.tar.gz" -o linux-x86.tar.gz

          {
            echo "mac_arm=$(sha256sum mac-arm.tar.gz | cut -d' ' -f1)"
            echo "linux_x86=$(sha256sum linux-x86.tar.gz | cut -d' ' -f1)"
          } >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tenatarika/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate prebuilt-binary Formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA_MAC_ARM: ${{ steps.sha.outputs.mac_arm }}
          SHA_LINUX_X86: ${{ steps.sha.outputs.linux_x86 }}
        run: |
          set -euo pipefail
          cd homebrew-tap

          # Full formula regeneration via heredoc — `sed`-patching only
          # the url/sha lines (the old approach) couldn't introduce the
          # `on_macos { on_arm { ... } }` / `on_linux { on_intel { ... } }`
          # structure needed for platform-specific prebuilt URLs.
          cat > Formula/vex.rb <<EOF
          class Vex < Formula
            desc "Fast hybrid structural + semantic code search (vector + index)"
            homepage "https://github.com/tenatarika/vex"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/tenatarika/vex/releases/download/${TAG}/vex-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            head do
              url "https://github.com/tenatarika/vex.git", branch: "main"
              depends_on "rust" => :build
            end

            def install
              if build.head?
                # Match the prebuilt bottle: bake CoreML into macOS source
                # builds. Linux --HEAD stays CPU (no vendor-agnostic EP; CUDA
                # needs a host SDK). See docs/GPU_SUPPORT.md §6.
                args = std_cargo_args
                args += ["--features", "gpu-coreml"] if OS.mac?
                system "cargo", "install", *args
              else
                bin.install "vex"
              end
            end

            test do
              assert_match "vex #{version}", shell_output("#{bin}/vex --version")
            end
          end
          EOF
          cat Formula/vex.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vex.rb
          git commit -m "bump vex to ${{ steps.version.outputs.tag }} (prebuilt)"
          git push
