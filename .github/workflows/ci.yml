name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Xcode 16.3+ dropped the static libclang_rt.osx.a that rustc's link
      # step references (`-lclang_rt.osx`) → `ld: library 'clang_rt.osx' not
      # found` on recent macos runners. Pin 16.2, the last Xcode shipping it.
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mold linker on Linux only — rust-lld hits SIGBUS / OOM when
      # linking 30+ test binaries with the full tree-sitter + ONNX dep
      # graph on the 7 GB GitHub runner. mold is both faster and far
      # more memory-efficient; macOS / Windows keep their default
      # linkers.
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'
      # rustfmt's output is platform-independent — run it once on linux only
      # to avoid spurious diff-on-CRLF flags.
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Surface CLI / integration test failures as their own PR check.
  # Duplicates work done in `test` on Linux, but the Swatinem cache
  # makes the second compile cheap and the separate badge is worth it
  # for the assert_cmd suites (cli_*_test.rs) which fail in cross-cutting
  # ways unrelated to unit tests.
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - name: Run cli_*_test.rs suites
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          for f in tests/cli_*_test.rs; do
            FLAGS+=(--test "$(basename "$f" .rs)")
          done
          cargo test "${FLAGS[@]}"

  # MSRV gate matches package.rust-version in Cargo.toml. `cargo check`
  # is enough — running the full test suite on an older toolchain adds
  # little signal beyond "does it still compile".
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - run: cargo check --workspace --all-targets --locked

  # Beta gives early warning about regressions in upcoming stable.
  # Allowed to fail — informational only.
  beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - run: cargo test --workspace

  # Ranking eval (Phase 13.12.1) — produces a debuggable artifact for
  # every PR. The actual regression gate lives in `cargo test --workspace`
  # via `tests/ranking_regression_test.rs`; this job only uploads the
  # full `vex eval --json` report so triaging a failure doesn't require
  # re-running locally. `if: always()` so the artifact still uploads
  # when the eval itself fails (e.g. the floor was breached).
  ranking-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - name: Build index
        run: cargo run --release --quiet -- index
      - name: Run eval and capture JSON
        # Redirect (not `tee`) so we capture only the JSON envelope and
        # don't let `tee`'s success swallow a non-zero exit from
        # `vex eval`. `|| true` is explicit: this job is a debugging
        # aid, not the regression gate (`cargo test --workspace`
        # already runs `tests/ranking_regression_test.rs` on 3 OS). A
        # non-zero exit here still uploads the partial report for
        # triage, which is exactly what we want.
        run: cargo run --release --quiet -- eval --json > eval-report.json || true
      - name: Print eval report inline
        if: always()
        run: cat eval-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-eval-report
          path: eval-report.json
          # `warn` (not `error`) so a build-step failure that skips
          # the eval step doesn't pile a second failure on top of the
          # first — the missing report on a failed build is expected.
          if-no-files-found: warn

  # Compile benches without running them — catches API drift in
  # benches/bundle.rs (custom criterion harness) before it lands on main.
  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rui314/setup-mold@v1
      - run: cargo bench --workspace --no-run

  # Compile-guard so an opt-in GPU execution-provider feature never bit-rots.
  # Each EP only builds on its host OS (ort/coreml on Apple, ort/directml on
  # Windows), so this mirrors the release `build` matrix rather than living as
  # a step in `test`. `cargo check` only — CI runners have no GPU, so this
  # verifies the feature COMPILES; it does not (and can't) measure GPU perf or
  # exercise the runtime EP. CUDA is source-build-only (needs a host CUDA/cuDNN
  # SDK absent from stock runners) → not checked here. See docs/GPU_SUPPORT.md.
  check-gpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: gpu-coreml
          - os: windows-latest
            features: gpu-directml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # See the `test` job: pin Xcode 16.2 so the macOS (gpu-coreml) leg links.
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: "16.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features ${{ matrix.features }}
