name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # mold linker on Linux only — rust-lld hits SIGBUS / OOM when
      # linking 30+ test binaries with the full tree-sitter + ONNX dep
      # graph on the 7 GB GitHub runner. mold is both faster and far
      # more memory-efficient; macOS / Windows keep their default
      # linkers.
      - uses: rui314/setup-mold@v1
        if: matrix.os == 'ubuntu-latest'
      # rustfmt's output is platform-independent — run it once on linux only
      # to avoid spurious diff-on-CRLF flags.
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
