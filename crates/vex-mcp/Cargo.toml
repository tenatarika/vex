[package]
name = "vex-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for vex code search"
license = "MIT"

[[bin]]
name = "vex-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.41", features = ["json"] }
