# crates.io package name is `vex-search-mcp` (`vex-mcp` is taken there); the
# installed binary stays `vex-mcp` ([[bin]] below), matching the release
# assets `vex-mcp-<target>.tar.gz`. It talks to the `vex` CLI as a subprocess
# and has no dependency on the `vex-search` library.
[package]
name = "vex-search-mcp"
version.workspace = true
edition = "2021"
description = "MCP (Model Context Protocol) stdio server exposing the vex code-search CLI to AI agents"
license = "MIT"
authors = ["Furcas <tenatarika@gmail.com>"]
repository = "https://github.com/tenatarika/vex"
homepage = "https://github.com/tenatarika/vex"
documentation = "https://github.com/tenatarika/vex/tree/main/integrations"
readme = "../../README.md"
rust-version = "1.88"
keywords = ["mcp", "code-search", "ai-agents", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/Cargo.toml", "/LICENSE"]

[[bin]]
name = "vex-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.41", features = ["json"] }
